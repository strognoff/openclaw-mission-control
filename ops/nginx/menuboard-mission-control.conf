# Suggested nginx vhost snippet for Mission Control.
#
# This is a SUGGESTION, not a deployment script. Paste it into the existing
# menuboard-marketing vhost (or a new vhost for api.menuboard.online) and
# reload nginx AFTER running `nginx -t`.
#
# Assumption: the existing cert covers both menuboard.online and
# api.menuboard.online (single SAN cert or wildcard).

# ── Dashboard at menuboard.online/agents/ ──────────────────────────────────
# Inside the existing `server { ... } menuboard.online` block, add:

    location /agents/ {
        proxy_pass http://127.0.0.1:3030/;   # adjust to whatever port the Next.js standalone listens on
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE is not used by the dashboard in a proxied form (EventSource hits
        # the API directly), but these two don't hurt.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

# ── API at api.menuboard.online/v1/agents/ ────────────────────────────────
# Inside the existing `server { ... } api.menuboard.online` block, add or
# refine:

    location /v1/agents/ {
        proxy_pass http://127.0.0.1:8787/v1/agents/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: turn off buffering so chunks flush to the client immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;     # long-lived SSE connection
        proxy_send_timeout 3600s;

        # CORS handled at the app layer (CORS_ORIGINS env var).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

# After pasting, run:
#   sudo nginx -t
#   sudo systemctl reload nginx
# (NEVER `nginx -s reload` blindly without `-t` first.)