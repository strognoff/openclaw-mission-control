server {
    server_name menuboard.online www.menuboard.online;

    root /var/www/menuboard/marketing;
    index index.html;

    # Super Live Sports TV (React app) - served at /sports
    location ^~ /sports {
        alias /var/www/menuboard/sports;
        index index.html;
        try_files $uri $uri/ /sports/index.html;
    }

    location / {
        try_files $uri $uri/ $uri.html $uri/index.html /index.html;
    }

    # Public Menu App - served at /menu/{slug}
    location /menu/ {
        alias /var/www/menuboard/menu/;
        index public-menu.html;
        try_files $uri $uri/ /menu/public-menu.html;
    }
    location ~ ^/menu/assets/(.*)$ {
        alias /var/www/menuboard/menu/assets/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/menuboard.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menuboard.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/image/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRE demo (Next.js prototype, basePath /CRE) — pm2 process "cre-demo" on :3400
    # See REMOVE-CRE-DEMO.md in /home/cechinel/.openclaw/workspace/CRE-design-draft/
    # ^~ prevents the static-asset regex below from intercepting /CRE/_next/static/*
    location ^~ /CRE {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Mission Control Dashboard (added 2026-09-10 — OpenClaw Mission Control deploy)
    location ^~ /agents/ {
        proxy_pass http://127.0.0.1:8789/agents/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
server {
    if ($host = www.menuboard.online) {
        return 301 https://$host$request_uri;
    }
    if ($host = menuboard.online) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name menuboard.online www.menuboard.online;
    return 404;
}
