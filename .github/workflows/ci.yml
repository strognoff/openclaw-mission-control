name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prisma generate (API)
        working-directory: apps/api
        run: npx prisma generate

      - name: Type-check
        run: |
          npx tsc -p packages/shared/tsconfig.json --noEmit
          npx tsc -p packages/plugin/tsconfig.json --noEmit
          npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Lint
        run: npm run -ws --if-present lint

      - name: Unit tests
        run: npm test --workspaces --if-present

      - name: Build API
        working-directory: apps/api
        env:
          MC_ADMIN_KEY: 00000000000000000000000000000000
        run: npx prisma generate && npx tsc -p tsconfig.json

      - name: Build dashboard
        working-directory: apps/dashboard
        env:
          MC_ADMIN_KEY: 00000000000000000000000000000000
          MC_API_URL: http://127.0.0.1:8787/v1/agents
        run: npx next build

      - name: Build plugin
        working-directory: packages/plugin
        run: npx tsc -p tsconfig.json

  # Playwright is optional — kept out of the main matrix so the suite stays
  # fast. Triggered by label or manual dispatch.
  playwright:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-playwright')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: apps/dashboard
      - name: Build dashboard for smoke tests
        working-directory: apps/dashboard
        env:
          MC_ADMIN_KEY: 00000000000000000000000000000000
          MC_API_URL: http://127.0.0.1:8787/v1/agents
        run: npx next build
      - name: Smoke tests
        working-directory: apps/dashboard
        env:
          MC_DASHBOARD_BASE_URL: http://127.0.0.1:3000/agents
          MC_ADMIN_KEY: 00000000000000000000000000000000
          MC_API_URL: http://127.0.0.1:8787/v1/agents
        run: |
          (npx next start -p 3000 &) ; \
          (cd ../.. && MC_ADMIN_KEY=$MC_ADMIN_KEY MC_API_URL=$MC_API_URL npx tsx apps/api/src/server.ts &) ; \
          sleep 8 ; \
          npx playwright test --grep @smoke